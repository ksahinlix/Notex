# Render Blueprint: one free web service that serves both the API and the
# built web app (same origin -> no CORS, strict cookies).
# Secrets (DATABASE_URL, CLOUDFLARE_*, R2_*, GOOGLE_CLIENT_ID, OWNER_EMAIL) are set
# in the Render dashboard, never committed.
services:
  - type: web
    name: notex
    runtime: node
    plan: free
    buildCommand: cd web && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Reminder notifications (D21). The VAPID pair must stay the same across
      # deploys, or every browser's subscription stops working.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Guards /api/reminders/due and /api/backup; copy it into the
      # scheduler (cron-job.org).
      - key: CRON_SECRET
        generateValue: true
      # Backups to Cloudflare R2 (D23). Unset = no backups, nothing else changes.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
